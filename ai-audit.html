<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Identity Verification — BaseLayerOS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">

  <style>
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #111 100%);
      color: #e5e5e5;
    }
    .container {
      margin-top: 3rem;
    }
    h1 {
      color: #0ff;
    }
  </style>

  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=CAD"></script>
</head>

<body>
  <main class="container">
    <h1>Identity Verification Workflow</h1>
    <p>Deterministic identity verification with full audit trace.</p>

    <div id="paypal-identity"></div>
  </main>

  <script>
    paypal.Buttons({
      createOrder: () => fetch("/api/create-order?workflow=identity").then(r => r.json()).then(d => d.id),
      onApprove: d => fetch(`/api/capture-order?orderID=${d.orderID}`)
    }).render("#paypal-identity");
  </script>
</body>
</html>
