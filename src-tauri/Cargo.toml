[package]
name = "baselayeros-console"
version = "2.0.0"
edition = "2021"
rust-version = "1.70"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

baselayeros-verification = { path = "..baselayeros-verification" }

